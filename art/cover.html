<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #0C4A6E 0%, #082F49 55%, #0A1626 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #A5F3FC; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #22D3EE; box-shadow: 0 0 18px #22D3EE; }
  h1 { font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#67E8F9,#93C5FD); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #CBD5E1; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #CFFAFE; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(56,189,248,.30), transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">ToC</span></h1>
      <p class="sub">A table of contents from Bard, Markdown or plain HTML &mdash; with the matching heading anchors written into the content.</p>
      <div class="badges">
        <span class="badge">Bard</span>
        <span class="badge">Markdown</span>
        <span class="badge">HTML</span>
        <span class="badge">Anchors</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#06B6D4"/><stop offset="1" stop-color="#2563EB"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#082F49" flood-opacity="0.32"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- page -->
        <g filter="url(#sh)">
          <rect x="112" y="112" width="288" height="288" rx="36" fill="#FFFFFF"/>
        </g>
        <!-- top-level entries -->
        <g fill="url(#bg)">
          <rect x="150" y="162" width="26" height="26" rx="8"/>
          <rect x="192" y="166" width="166" height="18" rx="9"/>
          <rect x="150" y="320" width="26" height="26" rx="8"/>
          <rect x="192" y="324" width="138" height="18" rx="9"/>
        </g>
        <!-- nested entries -->
        <g fill="url(#bg)" opacity="0.5">
          <rect x="188" y="222" width="20" height="20" rx="6"/>
          <rect x="224" y="224" width="134" height="16" rx="8"/>
          <rect x="188" y="270" width="20" height="20" rx="6"/>
          <rect x="224" y="272" width="106" height="16" rx="8"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
